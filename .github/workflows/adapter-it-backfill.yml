name: adapter-it-backfill

# One-shot full import: the "alba dei tempi" snapshot of the whole Italian corpus.
# Manual only. The runner commits one act per commit directly to the archive repo,
# so the archive's history grows act by act during the run. Each act is fetched as
# its CURRENT consolidated (vigente) version — one file carrying the in-force text
# plus its full amendment apparatus in <lifecycle>/<analysis>, not the whole
# version history (richiestaExport="V").
#
# A full corpus walk can exceed Actions' job time limit. If it does, run this on
# a self-hosted runner (set runs-on accordingly) — the runner.run code is the
# same. Actions stays the orchestrator; the heavy lifting can move off it.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner to use (ubuntu-latest or a self-hosted label)"
        default: "ubuntu-latest"
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: adapter-it-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 1440
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          path: pipeline

      - name: Checkout archive (target repo)
        uses: actions/checkout@v4
        with:
          repository: OpenLawsFoundation/archive
          path: archive
          token: ${{ secrets.ARCHIVE_WRITE_TOKEN }}

      # actions/setup-python ships no ARM64 Python for Ubuntu 20.04, so on a
      # self-hosted ARM64 runner it can't fetch 3.12. uv pulls a portable
      # standalone build (from GitHub, which is not IP-blocked) and works on any
      # arch/OS. Nothing here is runner-specific; the egress proxy stays the
      # runner's own config.
      - name: Set up Python 3.12 (uv)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install deps
        working-directory: pipeline
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/olfvenv"
          uv pip install --python "$RUNNER_TEMP/olfvenv/bin/python" -r requirements.txt

      - name: Full backfill
        working-directory: pipeline/pipeline
        run: |
          "$RUNNER_TEMP/olfvenv/bin/python" -m adapters.runner.run \
            --jurisdiction it \
            --archive "${GITHUB_WORKSPACE}/archive" \
            --backfill \
            --commit --push \
            --git-name "normattiva-adapter" \
            --git-email "normattiva-adapter@users.noreply.github.com" \
            --status-file "$RUNNER_TEMP/backfill-status.txt"

      # The corpus (~142k acts) is far larger than one run can archive: Normattiva
      # throttles the async export after a few hundred jobs, and Actions caps a job
      # at 24h. The run above stops cleanly (exit 0) at the throttle/soft-deadline,
      # having committed its progress + an updated resume ledger. Here we re-dispatch
      # the SAME workflow to pick up where it left off — but ONLY while it is making
      # forward progress, so a throttled run with nothing new does NOT loop forever.
      - name: Continue backfill if incomplete
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
        run: |
          STATUS_FILE="$RUNNER_TEMP/backfill-status.txt"
          if [ ! -f "$STATUS_FILE" ]; then
            echo "No status file at $STATUS_FILE — backfill step did not complete; not re-dispatching."
            exit 0
          fi
          echo "----- backfill status -----"
          cat "$STATUS_FILE"
          echo "---------------------------"
          COMPLETE="$(grep -E '^BACKFILL_COMPLETE=' "$STATUS_FILE" | tail -1 | cut -d= -f2)"
          PROGRESS="$(grep -E '^BACKFILL_PROGRESS=' "$STATUS_FILE" | tail -1 | cut -d= -f2)"
          REMAINING="$(grep -oE 'remaining=[0-9]+' "$STATUS_FILE" | tail -1 | cut -d= -f2)"
          PROGRESS="${PROGRESS:-0}"
          echo "parsed: complete=$COMPLETE progress=$PROGRESS remaining=$REMAINING"

          if [ "$COMPLETE" = "true" ]; then
            echo "Backfill COMPLETE (remaining=0). Not re-dispatching."
            exit 0
          fi
          if [ "$PROGRESS" -le 0 ] 2>/dev/null; then
            echo "Run made ZERO progress (throttled with nothing new). Not re-dispatching to avoid an infinite no-progress loop; a later manual/cron run can resume."
            exit 0
          fi

          echo "Incomplete and made progress ($PROGRESS this run, $REMAINING remaining). Cooling down before re-dispatch so Normattiva's export throttle resets..."
          sleep 1200
          echo "Re-dispatching adapter-it-backfill.yml (runner=${{ github.event.inputs.runner }})"
          gh workflow run adapter-it-backfill.yml \
            -f runner="${{ github.event.inputs.runner }}" \
            -R "${{ github.repository }}"
