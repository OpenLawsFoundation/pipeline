name: adapter-it-backfill

# One-shot full import: the "alba dei tempi" snapshot of the whole Italian corpus.
# Manual only. This is a single ACQUISITION event, not retroactive git history:
# each file is born already multivigente (the full legal time-history lives
# INSIDE the AKN), so this produces one big commit/PR "Italy imported at <date>",
# not 200k dated commits.
#
# A full corpus walk can exceed Actions' job time limit. If it does, run this on
# a self-hosted runner (set runs-on accordingly) — the runner.run code is the
# same. Actions stays the orchestrator; the heavy lifting can move off it.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner to use (ubuntu-latest or a self-hosted label)"
        default: "ubuntu-latest"
        required: true

permissions:
  contents: read

concurrency:
  group: adapter-it-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 1440
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          path: pipeline

      - name: Checkout archive (target repo)
        uses: actions/checkout@v4
        with:
          repository: OpenLawsFoundation/archive
          path: archive
          token: ${{ secrets.ARCHIVE_WRITE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Full backfill
        working-directory: pipeline/pipeline
        run: |
          python -m adapters.runner.run \
            --jurisdiction it \
            --archive "${GITHUB_WORKSPACE}/archive" \
            --backfill

      - name: Open PR to archive
        uses: peter-evans/create-pull-request@v6
        with:
          path: archive
          token: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
          branch: auto/it-backfill
          commit-message: "it: initial backfill from Normattiva"
          title: "Italy — initial backfill (acquisition snapshot)"
          body: |
            Full initial import of the Italian corpus from Normattiva.
            Each act is multivigente: its entire legal history is contained in
            the document, not in git history. This PR is the acquisition event.
          labels: jurisdiction:it, backfill, automated
