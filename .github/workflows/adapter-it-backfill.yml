name: adapter-it-backfill

# One-shot full import: the "alba dei tempi" snapshot of the whole Italian corpus.
# Manual only. The runner commits one act per commit directly to the archive repo,
# so the archive's history grows act by act during the run. Each act is
# multivigente: its entire legal time-history lives INSIDE the AKN document.
#
# A full corpus walk can exceed Actions' job time limit. If it does, run this on
# a self-hosted runner (set runs-on accordingly) — the runner.run code is the
# same. Actions stays the orchestrator; the heavy lifting can move off it.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner to use (ubuntu-latest or a self-hosted label)"
        default: "ubuntu-latest"
        required: true

permissions:
  contents: read

concurrency:
  group: adapter-it-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 1440
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          path: pipeline

      - name: Checkout archive (target repo)
        uses: actions/checkout@v4
        with:
          repository: OpenLawsFoundation/archive
          path: archive
          token: ${{ secrets.ARCHIVE_WRITE_TOKEN }}

      # actions/setup-python ships no ARM64 Python for Ubuntu 20.04, so on a
      # self-hosted ARM64 runner it can't fetch 3.12. uv pulls a portable
      # standalone build (from GitHub, which is not IP-blocked) and works on any
      # arch/OS. Nothing here is runner-specific; the egress proxy stays the
      # runner's own config.
      - name: Set up Python 3.12 (uv)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install deps
        working-directory: pipeline
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/olfvenv"
          uv pip install --python "$RUNNER_TEMP/olfvenv/bin/python" -r requirements.txt

      - name: Full backfill
        working-directory: pipeline/pipeline
        run: |
          "$RUNNER_TEMP/olfvenv/bin/python" -m adapters.runner.run \
            --jurisdiction it \
            --archive "${GITHUB_WORKSPACE}/archive" \
            --backfill \
            --commit --push \
            --git-name "normattiva-adapter" \
            --git-email "normattiva-adapter@users.noreply.github.com"
